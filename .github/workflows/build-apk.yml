name: Build EduQuinn Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'EduQuinn-Android-Build-Ready/EduQuinn-Android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # skips the removed default 'tools' package

      - name: Install Android API 36 and Build Tools
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode signing keystore
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build signed release bundle (AAB)
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: gradle --no-daemon bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: EduQuinn-AAB
          path: EduQuinn-Android-Build-Ready/EduQuinn-Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
