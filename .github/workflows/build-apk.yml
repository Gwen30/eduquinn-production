name: Build EduQuinn Release

on:
  workflow_dispatch:
  push:
    paths:
      - 'EduQuinn-Android-Build-Ready/EduQuinn-Android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''   # skips the removed default 'tools' package

      - name: Install Android API 36 and Build Tools
        run: |
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        # The project now ships its own Gradle wrapper (pinned to 8.13 in
        # gradle/wrapper/gradle-wrapper.properties), so ./gradlew drives the
        # version; this action is kept for its build-cache/daemon setup.

      - name: Make gradlew executable
        # gradlew is committed with the executable bit set (100755), but
        # that bit doesn't survive every path a commit can take before it
        # reaches this checkout - a Windows git client, a patch applied
        # with `git apply` instead of `git am`, or a manual re-save can all
        # silently flip it back to 100644, which fails here with "Permission
        # denied" (exit 126) rather than anywhere closer to the cause. Doing
        # this unconditionally means the build never depends on whatever the
        # tracked mode happens to be by the time it's pushed.
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: chmod +x gradlew

      - name: Decode signing keystore
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.jks

      - name: Build signed release bundle (AAB)
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: ./gradlew --no-daemon bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: EduQuinn-AAB
          path: EduQuinn-Android-Build-Ready/EduQuinn-Android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  # Boots a free emulator in CI, installs a debug build (no keystore
  # needed - debug builds self-sign), launches the app the same way
  # tapping the icon does, and dumps logcat. This exists purely to get a
  # real crash stack trace for the "EduQuinn keeps stopping" launch
  # crash: USB adb kept failing on the test device and Play Console's
  # Android vitals only collects from installs that went through Play
  # itself, not sideloaded builds, so neither path has produced one yet.
  # Runs independently of the release job above - no secrets required.
  diagnose-crash:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
        run: ./gradlew --no-daemon assembleDebug

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Boot emulator, install app, capture crash log
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android
          script: |
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell monkey -p zw.co.eduquinn.app -c android.intent.category.LAUNCHER 1
            sleep 15
            adb logcat -d > logcat-full.txt
            echo "===================== FATAL EXCEPTION / AndroidRuntime lines ====================="
            grep -A 80 -E "FATAL EXCEPTION|AndroidRuntime" logcat-full.txt || echo "No FATAL EXCEPTION found in this run - see the full logcat-full.txt artifact instead."

      - name: Upload full logcat
        uses: actions/upload-artifact@v4
        with:
          name: EduQuinn-crash-logcat
          path: EduQuinn-Android-Build-Ready/EduQuinn-Android/logcat-full.txt
          if-no-files-found: warn
