name: Build EduQuinn APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'EduQuinn-Android-Build-Ready/EduQuinn-Android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: EduQuinn-Android-Build-Ready/EduQuinn-Android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk \
             app/build/outputs/apk/debug/EduQuinn.apk

      - name: Upload EduQuinn APK
        uses: actions/upload-artifact@v4
        with:
          name: EduQuinn-APK
          path: EduQuinn-Android-Build-Ready/EduQuinn-Android/app/build/outputs/apk/debug/EduQuinn.apk
