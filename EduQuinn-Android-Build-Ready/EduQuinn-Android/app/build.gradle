plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'org.jetbrains.kotlin.plugin.serialization'
}

android {
    namespace 'zw.co.eduquinn.app'
    compileSdk 36

    defaultConfig {
        applicationId "zw.co.eduquinn.app"
        minSdk 24
        targetSdk 36
        // Play Console rejects a re-upload of a versionCode it has already
        // seen, even on a brand-new, never-published app - bump this every
        // time you need to upload a new build, including just to replace a
        // closed-testing release while chasing down a fix.
        versionCode 24
        versionName "1.6.10"
    }

    signingConfigs {
        release {
            storeFile file("release.jks")
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Required for Compose + the Kotlin toolchain added in this pass; the
    // module previously had no Kotlin/Java version config at all.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        buildConfig true
    }
}

dependencies {
    // --- existing, unchanged ---
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.10.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'

    // --- Compose ---
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.core:core-ktx:1.15.0'

    // --- Navigation ---
    implementation 'androidx.navigation:navigation-compose:2.8.4'

    // --- Networking ---
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-kotlinx-serialization:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    // --- Session storage (persists the eq_session cookie across restarts) ---
    implementation 'androidx.security:security-crypto:1.1.0'

    // --- Paynow checkout handoff (Chrome Custom Tabs) ---
    implementation 'androidx.browser:browser:1.8.0'

    // --- Video lessons ---
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-datasource-okhttp:1.4.1'

    // --- Images ---
    implementation 'io.coil-kt:coil-compose:2.7.0'
}
