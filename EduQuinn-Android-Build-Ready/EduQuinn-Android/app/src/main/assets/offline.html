<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduQuinn — Offline</title>
<style>
  :root{--burgundy:#702632;--wine:#912f40;--ink:#080705;--slate:#40434e;--cream:#fffffa;--paper:#f7f2ed;--line:#e8ddd5;--gold:#c8922f}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--paper);font-family:Arial,Helvetica,sans-serif;color:var(--ink);padding:24px}
  .card{max-width:420px;width:100%;background:var(--cream);border:1px solid var(--line);border-radius:18px;padding:36px 28px;text-align:center;box-shadow:0 18px 45px rgba(30,12,16,.10)}
  .badge{width:64px;height:64px;border-radius:16px;margin:0 auto 18px;background:linear-gradient(135deg,#7c2d3c 0%,#702632 55%,#5c1f29 100%);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(112,38,50,.3)}
  .badge span{color:var(--cream);font-weight:700;font-size:26px;font-family:Georgia,serif}
  .eyebrow{color:var(--burgundy);font-size:11px;font-weight:800;letter-spacing:.14em;margin:0 0 8px}
  h1{font-family:Georgia,serif;font-size:24px;margin:0 0 10px;line-height:1.25}
  p{color:var(--slate);font-size:14px;line-height:1.55;margin:0 0 22px}
  button{border:0;border-radius:8px;padding:13px 22px;font-weight:700;font-size:14px;cursor:pointer;background:var(--burgundy);color:white;width:100%}
  button:active{background:var(--wine)}
</style>
</head>
<body>
  <main class="card">
    <div class="badge"><span>EQ</span></div>
    <p class="eyebrow">YOU ARE OFFLINE</p>
    <h1>Reconnect to continue</h1>
    <p>EduQuinn needs an internet connection to load your courses and account. Check your connection and try again.</p>
    <button onclick="location.href='https://eduquinn.co.zw/'">Try again</button>
  </main>
</body>
</html>
