<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><script src="/icons.js"></script><script src="/auth.js"></script><title>Manage Live Classes — EduQuinn</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#702632"></head><body>
<header class="site-header"><a class="brand" href="/"><span class="brand-mark">EQ</span><span><strong>EduQuinn</strong><small>Instructor Studio</small></span></a><button class="mobile-menu" id="mobileMenu" aria-label="Open menu"><span data-icon="menu"></span></button><nav id="mainNav"><a href="/instructor.html">Dashboard</a><a href="/instructor-courses.html">Courses</a><a href="/instructor-live.html">Live Classes</a><a href="/instructor-analytics.html">Analytics</a></nav><div class="header-actions"><a class="btn btn-ghost" href="/live-classes.html">Student view</a><button class="icon-button logout-button" data-logout aria-label="Log out"><span data-icon="logout"></span></button></div></header>
<main class="live-page"><section class="live-pagehead"><div><p class="eyebrow">INSTRUCTOR STUDIO</p><h1>Live class management</h1><p>Schedule sessions, control capacity and open the classroom when ready.</p></div><button class="btn btn-primary" id="showSchedule">Schedule a class</button></section><section class="panel" id="schedulePanel" hidden><div class="panel-head"><div><p class="eyebrow">NEW SESSION</p><h2>Schedule a live class</h2></div></div><form class="schedule-form" id="scheduleForm"><label class="full">Class title<input id="sessionTitle" required placeholder="e.g. Excel Dashboard Workshop"></label><label>Course<select id="sessionCourse"><option value="">Loading courses…</option></select></label><label>Session type<select id="sessionType"><option>Group class</option><option>Question and answer session</option><option>Workshop</option></select></label><label>Date<input id="sessionDate" type="date" required></label><label>Start time<input id="sessionTime" type="time" required></label><label>Duration<select id="sessionDuration"><option value="60">60 minutes</option><option value="90">90 minutes</option><option value="120">120 minutes</option></select></label><label>Maximum participants<input id="sessionCapacity" type="number" min="2" max="500" value="50"></label><label class="full">Session description<textarea id="sessionDescription" placeholder="Explain what learners will cover during this session."></textarea></label><label>Meeting provider<select id="meetingProvider"><option value="external">External / Other</option><option value="zoom">Zoom</option><option value="google_meet">Google Meet</option><option value="microsoft_teams">Microsoft Teams</option><option value="jitsi">Jitsi</option></select></label><label>Student meeting URL<input id="meetingJoinUrl" type="url" placeholder="https://..."></label><label class="full">Host meeting URL <small>(optional)</small><input id="meetingHostUrl" type="url" placeholder="https://..."></label><label class="check-row full"><input id="allowRecording" type="checkbox"> Allow recording for this session</label><div class="full"><button class="btn btn-primary" type="submit">Publish live class</button> <button class="btn btn-ghost" type="button" id="cancelSchedule">Cancel</button></div></form></section><section class="panel"><div class="panel-head"><div><p class="eyebrow">YOUR SESSIONS</p><h2>Scheduled live classes</h2></div></div><div class="session-table" id="sessionTable"></div></section></main>
<script src="/live.js"></script><script src="/pwa.js"></script></body></html>
