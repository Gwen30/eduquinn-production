<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><script src="/icons.js"></script><script src="/auth.js"></script><title>Live Classroom — EduQuinn</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#702632"></head><body class="live-room">
<header class="live-room-header"><a class="brand" href="/live-classes.html"><span class="brand-mark">EQ</span><span><strong>EduQuinn</strong><small>Live Classroom</small></span></a><div class="live-room-title"><b id="roomTitle">Live class</b><small id="roomSubtitle">Connecting to session…</small></div><a class="btn btn-ghost" id="leaveRoomTop" href="/live-classes.html">Leave room</a></header>
<main class="room-layout"><section class="stage"><div class="video-stage"><div class="presenter-placeholder"><span id="presenterInitials">TM</span><h2 id="presenterName">Instructor</h2><p id="providerNotice">EduQuinn is preparing your live session.</p><button class="btn btn-primary" id="launchMeeting" hidden>Open video meeting</button></div><div class="room-controls"><button id="micToggle" aria-label="Toggle microphone"><span data-icon="users"></span></button><button id="cameraToggle" aria-label="Toggle camera"><span data-icon="eye"></span></button><button id="handToggle" aria-label="Raise hand"><span data-icon="plus"></span></button><button class="danger" id="leaveRoom" aria-label="Leave session"><span data-icon="logout"></span></button></div></div></section><aside class="room-panel"><div class="room-tabs"><button class="active" data-room-tab="chat">Chat</button><button data-room-tab="people">Participants</button></div><div class="room-feed" id="roomFeed"></div><form class="chat-form" id="chatForm"><input id="chatInput" placeholder="Write a message…" autocomplete="off"><button type="submit">Send</button></form></aside></main>
<script src="/live.js"></script><script src="/pwa.js"></script></body></html>
