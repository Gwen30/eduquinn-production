<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — EduQuinn</title><link rel="stylesheet" href="/styles.css"><script src="/icons.js"></script><script src="/auth.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#702632"></head><body class="auth-body"><a class="brand auth-brand" href="/"><span class="brand-mark">EQ</span><span><strong>EduQuinn</strong><small>Learn. Grow. Succeed.</small></span></a><main class="auth-card auth-login-card"><div class="auth-form-panel"><p class="eyebrow">WELCOME BACK</p><h1>How are you logging in?</h1><p class="auth-intro">Choose your account type. EduQuinn will only open the tools assigned to that role.</p><div class="role-login-choice" id="roleChoice"><button type="button" data-role="student"><span data-icon="graduation"></span><div><b>Student</b><small>Learning, live classes and purchases</small></div></button><button type="button" data-role="instructor"><span data-icon="teacher"></span><div><b>Teacher</b><small>Courses, students, messages and earnings</small></div></button></div><form id="authForm" hidden><div class="selected-login-role"><button type="button" id="changeRole">← Change</button><strong id="selectedRoleLabel"></strong></div><label>Email address<input id="email" type="email" required autocomplete="username" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></label><div class="auth-row"><label class="check"><input type="checkbox"> Remember me</label><a href="/forgot-password.html">Forgot password?</a></div><p class="form-error" id="authError" role="alert"></p><button type="submit" class="btn btn-primary btn-full">Log in securely</button></form><p>New to EduQuinn? <a href="/signup.html">Create an account</a></p></div></main><script>
(()=>{const form=document.getElementById('authForm'),choice=document.getElementById('roleChoice'),email=document.getElementById('email'),password=document.getElementById('password'),err=document.getElementById('authError'),btn=form.querySelector('button[type="submit"]'),label=document.getElementById('selectedRoleLabel');let role='';function choose(r){role=r;choice.hidden=true;form.hidden=false;label.textContent=r==='student'?'Student login':'Teacher login';email.focus()}document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>choose(b.dataset.role));document.getElementById('changeRole').onclick=()=>{role='';form.hidden=true;choice.hidden=false;err.textContent=''};const q=new URLSearchParams(location.search);if(['student','instructor'].includes(q.get('role')))choose(q.get('role'));form.addEventListener('submit',async e=>{e.preventDefault();err.textContent='';btn.disabled=true;btn.textContent='Signing in…';const result=await EduQuinnAuth.login(email.value,password.value,'public',role);btn.disabled=false;btn.textContent='Log in securely';if(!result.ok){err.textContent=result.message;return}const next=q.get('next');location.replace(next||EduQuinnAuth.homeFor(result.user.role))})})();
</script><script src="/pwa.js"></script></body></html>
