<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — EduQuinn</title><link rel="stylesheet" href="/styles.css"><script src="/icons.js"></script><script src="/auth.js"></script><link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/app-icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#702632"></head><body class="auth-body"><a class="brand auth-brand" href="/"><span class="brand-mark">EQ</span><span><strong>EduQuinn</strong><small>Learn. Grow. Succeed.</small></span></a><main class="auth-card auth-login-card"><div class="auth-form-panel"><p class="eyebrow">WELCOME BACK</p><h1>How are you logging in?</h1><p class="auth-intro">Choose your account type. EduQuinn will only open the tools assigned to that role.</p><div class="role-login-choice" id="roleChoice"><button type="button" data-role="student"><span data-icon="graduation"></span><div><b>Student</b><small>Learning, live classes and purchases</small></div></button><button type="button" data-role="instructor"><span data-icon="teacher"></span><div><b>Teacher</b><small>Courses, students, messages and earnings</small></div></button></div><form id="authForm" hidden><div class="selected-login-role"><button type="button" id="changeRole">← Change</button><strong id="selectedRoleLabel"></strong></div><label>Email address<input id="email" type="email" required autocomplete="username" placeholder="you@example.com"></label><label>Password<input id="password" type="password" required autocomplete="current-password" placeholder="Enter your password"></label><div class="auth-row"><label class="check"><input type="checkbox"> Remember me</label><a href="/forgot-password.html">Forgot password?</a></div><p class="form-error" id="authError" role="alert"></p><button type="submit" class="btn btn-primary btn-full">Log in securely</button></form><p>New to EduQuinn? <a href="/signup.html">Create an account</a></p></div></main><script src="/mfa.js"></script><script src="/login.js"></script><script src="/pwa.js"></script></body></html>
