<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Support — EduQuinn</title><link rel="stylesheet" href="/styles.css"><script src="/icons.js"></script><script src="/auth.js"></script><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#702632"></head><body><header class="site-header support-header"><a class="brand" href="/"><span class="brand-mark">EQ</span><span><strong>EduQuinn</strong><small>Learn. Grow. Succeed.</small></span></a><div class="header-actions"><a class="btn btn-ghost" href="/">Marketplace</a></div></header><main class="support-page"><section class="support-intro"><p class="eyebrow">EDUQUINN SUPPORT</p><h1>How can we help?</h1><p>Send your question to the EduQuinn support team. Include enough detail for us to investigate quickly.</p></section><form class="studio-panel support-form" id="supportForm"><div class="form-grid"><label>Full name<input id="supportName" name="name" required autocomplete="name"></label><label>Email address<input id="supportEmail" name="email" type="email" required autocomplete="email"></label></div><div class="form-grid"><label>I am a<select id="supportRole" name="role"><option>Student</option><option>Instructor</option><option>Parent / Guardian</option><option>Organisation</option><option>Visitor</option></select></label><label>Topic<select id="supportTopic" name="topic"><option>Account access</option><option>Course or learning issue</option><option>Instructor / course publishing</option><option>Payments or refunds</option><option>Payouts</option><option>Live classes</option><option>Messages</option><option>Technical problem</option><option>Safety or content report</option><option>Other</option></select></label></div><label>Subject<input id="supportSubject" name="subject" required maxlength="120" placeholder="Briefly describe the issue"></label><label>Message<textarea id="supportMessage" name="message" required rows="8" maxlength="5000" placeholder="Tell us what happened, what you expected, and any error message you saw."></textarea></label><div class="support-actions"><button class="btn btn-primary" type="submit" id="supportSubmit">Send to EduQuinn Support</button><span id="supportDestination" class="support-destination"></span></div><p class="form-error" id="supportError" role="alert"></p><p class="support-success" id="supportSuccess" role="status"></p></form></main><script>const session=EduQuinnAuth.session();if(session){supportName.value=session.name||'';supportEmail.value=session.email||'';supportRole.value=session.role==='instructor'?'Instructor':session.role==='student'?'Student':'Visitor'}let supportAddress='support@eduquinn.co.zw';fetch('/api/support-config').then(r=>r.json()).then(x=>{if(x.email)supportAddress=x.email;supportDestination.textContent='Messages are sent to '+supportAddress}).catch(()=>{supportDestination.textContent='Messages are sent to '+supportAddress});supportForm.onsubmit=async e=>{e.preventDefault();supportError.textContent='';supportSuccess.textContent='';supportSubmit.disabled=true;supportSubmit.textContent='Sending…';const payload=Object.fromEntries(new FormData(supportForm));try{const r=await fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const x=await r.json();if(r.ok){supportSuccess.textContent=x.message||'Your support request has been sent.';supportForm.reset();if(session){supportName.value=session.name||'';supportEmail.value=session.email||''}return}if(x.fallback){const subject=encodeURIComponent('[EduQuinn Support] '+payload.topic+' — '+payload.subject);const body=encodeURIComponent('Name: '+payload.name+'\nEmail: '+payload.email+'\nRole: '+payload.role+'\nTopic: '+payload.topic+'\n\n'+payload.message);location.href='mailto:'+encodeURIComponent(x.email||supportAddress)+'?subject='+subject+'&body='+body;supportError.textContent='Email delivery is not configured on this server, so your email application has been opened instead.'}else supportError.textContent=x.message||'The support request could not be sent.'}catch(err){supportError.textContent='Unable to contact the support service. Please try again.'}finally{supportSubmit.disabled=false;supportSubmit.textContent='Send to EduQuinn Support'}};</script><script src="/pwa.js"></script></body></html>
