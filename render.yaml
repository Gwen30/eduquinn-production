services:
  - type: web
    name: eduquinn
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run migrate && npm run check:production
    startCommand: npm start
    healthCheckPath: /ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eduquinn-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: PAYMENT_SANDBOX
        value: "false"
      - key: SESSION_DAYS
        value: "14"
      # Required — the build runs `npm run check:production` as a deploy gate
      # (scripts/production-check.js) and the build FAILS if any of the
      # vars below are missing or still at their insecure defaults.
      - key: APP_BASE_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYNOW_INTEGRATION_ID
        sync: false
      - key: PAYNOW_INTEGRATION_KEY
        sync: false
      # Optional but recommended — enables transactional email (password
      # resets, order/refund notices, announcements). Build succeeds without
      # it, production-check.js just flags it as a warning, not a failure.
      - key: BREVO_API_KEY
        sync: false
databases:
  - name: eduquinn-db
    plan: basic-256mb
