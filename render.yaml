services:
  - type: web
    name: eduquinn
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run migrate
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: eduquinn-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: TRUST_PROXY
        value: "true"
      - key: PAYMENT_SANDBOX
        value: "false"
      - key: SESSION_DAYS
        value: "14"
databases:
  - name: eduquinn-db
    plan: basic-256mb
